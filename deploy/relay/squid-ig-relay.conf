# ══════════════════════════════════════════════════════════════════════════
#  Squid forward proxy — runs on FALCONPRD 10.19.71.246
#
#  PURPOSE: 10.19.75.115 has no route to the Instant Graph gateway
#  (10.34.64.74:5001). This relays CONNECT tunnels for it through .246.
#
#  WHY A CONNECT PROXY AND NOT A TCP/TLS TERMINATOR:
#  Squid never decrypts anything here — it only opens a TCP tunnel after
#  CONNECT. TLS stays end-to-end between the app on .115 and the gateway, so
#  the self-signed cert, the IG_CA_BUNDLE trust and the IG_CERT_HOSTNAME SAN
#  pinning all keep working with ZERO code changes. A terminating proxy would
#  break the pinning.
#
#  Install:
#    sudo cp squid-ig-relay.conf /etc/squid/conf.d/ig-relay.conf
#    sudo squid -k parse && sudo systemctl restart squid
# ══════════════════════════════════════════════════════════════════════════

# Only the new app server may use this relay.
acl ig_client src 10.19.75.115/32

# Only the Instant Graph gateway may be reached through it.
acl ig_upstream dst 10.34.64.74/32
acl ig_port     port 5001
acl CONNECT_method method CONNECT

# Squid refuses CONNECT to non-standard ports unless whitelisted.
acl SSL_ports port 5001
acl Safe_ports port 5001

http_access allow ig_client CONNECT_method ig_upstream ig_port
http_access deny  all

http_port 3128

# This is a machine-to-machine relay: no caching, no client identification.
cache deny all
forwarded_for delete
via off

access_log /var/log/squid/ig-relay.log
